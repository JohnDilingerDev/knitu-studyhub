function exams(){return header('Зачёты и экзамены','Сессия 11-24 января 2027 года · КНИТУ')+`<div class="panel"><h2>Экзаменационное расписание</h2>${entries().filter(x=>x.Category==='exam').map(x=>`<h3 class="dayhead">${E(longDate(x.Date))}</h3>${lesson(x)}`).join('')}</div><div class="panel"><h2>Зачёты</h2><p>По рабочему плану предусмотрены зачёты по ИПП, ПОПДБМ, ЭАУП и ПОИЯ. Точные даты в экзаменационной выгрузке не установлены.</p><p class="warning">10.12.2026 - предварительная дата зачёта по английскому (VK 19.10); не подтверждена официальным расписанием.</p></div>`}
function deadlines(){return header('Сроки сдачи','Различаем подтверждённые даты экзаменов, сообщения группы и предварительные ориентиры.')+`<div class="panel">${data.deadlines.map(d=>`<div class="entry"><div class="row"><strong>${E(fmt(d.date))} · ${E(subject(d.subject))}</strong><span class="tag">${d.date<dayNow()?'Дата прошла':'Предстоящий срок'}</span></div><p>${E(d.subject)}</p><p class="warning">${E(d.status)}</p><small>${E(d.source)}</small></div>`).join('')}<p class="notice">«До 1 декабря» - рекомендуется завершить сдачу к 30 ноября, если преподаватель не уточнил иное.</p></div><div class="panel"><h2>Официальные даты сессии</h2>${entries().filter(x=>x.Category==='exam').map(x=>`<div class="entry"><strong>${E(fmt(x.Date))} · ${E(x.Type)}</strong><div>${E(x.Subject)} · ${E(x.Start)}-${E(x.End)}</div></div>`).join('')}</div>`}
function materials(){return header('Учебные материалы','Каталог известных источников. Закрытые учебные вложения и переписка группы не опубликованы.')+`<div class="panel"><h2>Официальные ресурсы</h2><div class="entry"><a href="https://www.kstu.ru/www_Ggrid.jsp?f=297&g=47638" target="_blank" rel="noopener">Расписание группы КНИТУ</a></div><div class="entry"><a href="https://www.kstu.ru/www_GEgrid.jsp?f=297&g=47638&idk=55952&d=2027-01-11" target="_blank" rel="noopener">Расписание экзаменов</a></div><div class="entry"><a href="https://moodle.kstu.ru/" target="_blank" rel="noopener">Moodle КНИТУ</a></div></div><div class="panel"><h2>Что искать в учебных материалах</h2>${[['ИПП','Задание 1, задание 2, диагностика, шаблон программы повышения квалификации'],['МИПП','Темы доклада, вопросы к экзамену, билеты, лекция Л-1'],['ЭАУП','СРС-ЭАУП-маг-техн-2026.pdf'],['ТХБП','Водоподготовка, Вопросы по воде'],['Общие','Требования к оформлению реферата, рабочий учебный план, календарный график']].map(([a,b])=>`<div class="entry"><strong>${a}</strong><div>${E(b)}</div></div>`).join('')}<p class="muted">Перечень - ориентир, а не ссылка на непроверенные или закрытые файлы.</p></div>`}
function settings(){return header('Настройки','Прогресс хранится только в текущем браузере и не синхронизируется автоматически.')+`<div class="panel"><h2>Личные данные</h2><p>Полный номер зачётки, ФИО и пароли не запрашиваются. Сохраняется только последняя цифра и отметки заданий.</p><div class="controls"><button id="export">Скачать мои отметки</button><button id="import">Импорт отметок</button><input type="file" id="importFile" accept="application/json,.json" hidden><button id="reset">Сбросить личные отметки</button></div><div id="msg" role="status"></div></div><div class="panel"><h2>Обновление общей базы</h2><p>Версия ${E(data.version)} · требования актуализированы ${E(fmt(data.updated))}; расписание от ${E(fmt(data.schedule.created.slice(0,10)))}.</p><p>${location.protocol==='file:'?'Открыта автономная копия. Для обновления получите новую версию файла или откройте размещённый сайт.':'На опубликованном сайте данные загружаются из data.json. Для обновления перезагрузите страницу; при отсутствии сети используется сохранённая база.'}</p><button id="reload">Перезагрузить страницу</button><p class="muted">Сайт не связан с Moodle и не получает оценки или личные задолженности из КНИТУ. Статусы вводит сам студент. Сведения из чатов могут требовать уточнения.</p></div>`}
const pages={home,schedule,tasks,variants,exams,deadlines,materials,settings};function render(){document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('');document.getElementById('main').innerHTML=(!storageOK?'<p class="warning">Браузер не разрешает сохранение отметок. Используйте экспорт или откройте сайт в обычном браузере.</p>':'')+pages[tab]();document.getElementById('foot').textContent='KNITU StudyHub 1.0 · 661-М52 ИППБТ · неофициальный ресурс · данные от '+fmt(data.updated);document.documentElement.dataset.theme=theme;}
function go(t){if(pages[t]){tab=t;render();window.scrollTo({top:0,behavior:'auto'})}}
function saveFile(obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='studyhub-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],button');if(!el)return;if(el.dataset.tab)return go(el.dataset.tab);if(el.dataset.shift){selected=addDays(selected,Number(el.dataset.shift)*(mode==='week'?7:1));if(mode==='all')mode='day';render();return}switch(el.id){case'theme':theme=theme==='dark'?'light':theme==='light'?'auto':'dark';write('theme',theme);render();break;case'today':selected=dayNow();mode='day';render();break;case'tomorrow':selected=addDays(dayNow(),1);mode='day';render();break;case'export':saveFile({group:'661-М52',version:1,digit,progress});break;case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Удалить все личные отметки и выбранную цифру?')){progress={};digit='';write('progress',progress);write('digit',digit);render()}break;case'reload':location.reload();break}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tile[data-tab]')){e.preventDefault();go(e.target.dataset.tab)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.task){if(statuses.includes(el.value)){progress[el.dataset.task]=el.value;write('progress',progress);render()}return}switch(el.id){case'date':if(el.value){selected=el.value;render()}break;case'mode':mode=el.value;render();break;case'subjectFilter':filter=el.value;render();break;case'statusFilter':statusFilter=el.value;render();break;case'digit':digit=el.value;write('digit',digit);render();break;case'importFile':try{const file=el.files[0];if(!file)return;const obj=JSON.parse(await file.text());if(obj.group!=='661-М52'||obj.version!==1||!obj.progress||typeof obj.progress!=='object'||Array.isArray(obj.progress))throw Error('Неверный формат');if(!confirm('Заменить текущие отметки импортированными?'))return;progress=Object.fromEntries(data.tasks.filter(t=>statuses.includes(obj.progress[t.id])).map(t=>[t.id,obj.progress[t.id]]));digit=/^[0-9]$/.test(String(obj.digit))?String(obj.digit):'';write('progress',progress);write('digit',digit);render();document.getElementById('msg').textContent='Отметки импортированы.'}catch(err){document.getElementById('msg').textContent='Не удалось импортировать: проверьте файл.'}break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const box=document.getElementById('search');box.focus();box.setSelectionRange(pos,pos)}});
function valid(d){return d&&d.schedule&&d.schedule.group==='661-М52 ИППБТ'&&Array.isArray(d.schedule.entries)&&Array.isArray(d.schedule.coverage)&&Array.isArray(d.tasks)&&Array.isArray(d.variants)&&d.variants.length===4&&d.variants.every(v=>v.length===10)&&Array.isArray(d.deadlines)&&d.subjects&&d.updated}
render();if(location.protocol==='https:'||location.protocol==='http:'){fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(valid(d)){data=d;render()}}).catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script></body></html>
