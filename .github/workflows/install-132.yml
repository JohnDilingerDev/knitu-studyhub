name: StudyHub - install 1.3.2 and test MySQL
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/install-132.yml']
permissions:
  contents: write
concurrency:
  group: studyhub-install-132
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-test-only
          MYSQL_DATABASE: studyhub_private_ci
          MYSQL_USER: studyhub
          MYSQL_PASSWORD: ci-app-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: studyhub_private_ci
      MYSQL_USER: studyhub
      MYSQL_PASSWORD: ci-app-test-only
