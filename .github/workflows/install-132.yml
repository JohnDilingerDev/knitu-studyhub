          sha = lambda b: hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as z:
              if sorted(z.namelist()) != sorted(manifest):
                  raise RuntimeError('Unexpected archive file list')
              if z.testzip() is not None:
                  raise RuntimeError('Invalid archive')
              for name, info in manifest.items():
                  p = Path(name)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] != 'server' or p.is_symlink() or any(x.is_symlink() for x in p.parents):
                      raise RuntimeError('Unsafe path: ' + name)
                  current = sha(p.read_bytes()) if p.exists() else None
                  if current not in (info['before'], info['after']):
                      raise RuntimeError('Local file changed; refusing overwrite: ' + name)
                  if sha(z.read(name)) != info['after']:
                      raise RuntimeError('Checksum mismatch: ' + name)
              for name in manifest:
                  p = Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(name))
          print('Verified patch: 9 files')
          PYINSTALL
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: server
        run: python -m pip install -r requirements-dev.txt
      - name: Run SQLite tests
        working-directory: server
        run: python -m pytest -q
      - name: Migrate and import in MySQL
        working-directory: server
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m app.import_data
          python -m app.import_data
      - name: Verify public MySQL API
        working-directory: server
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.import_data import load_json, SLUG
          with TestClient(app) as c:
              assert c.get('/health').json()['status']=='ok'
              data=load_json('seed/data.json'); content=load_json('seed/content.json')
              r=c.get(f'/api/v1/groups/{SLUG}/bundle'); assert r.status_code==200
              b=r.json()
              for k in ('schedule','variants'): assert b[k]==data[k],k
              for k in ('tasks','announcements','deadlines'): assert b[k]==content[k],k
              assert c.post('/api/v1/auth/max').status_code==503
              print('Public MySQL API verified')
          PY
      - name: Test MAX sessions and protected API on disposable MySQL
        working-directory: server
        env:
          STUDYHUB_PRIVATE_TEST_DB: mysql+pymysql://studyhub:ci-app-test-only@127.0.0.1:3306/studyhub_private_ci?charset=utf8mb4
        run: python -m pytest -q tests/test_private.py tests/test_cabinet.py
      - name: Install Chromium for mobile smoke test
        working-directory: server
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test mobile cabinet in Chromium
        working-directory: server
        run: |
          PYTHONPATH=. python scripts/browser_smoke.py
      - name: Commit verified server update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server
          if git diff --cached --quiet; then
            echo 'Already installed'
          else
            git commit -m 'StudyHub 1.3.2 - API cabinet and MAX interface'
            git push origin HEAD:develop
          fi
