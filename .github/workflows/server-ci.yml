name: StudyHub - MySQL Server CI

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-test-only
          MYSQL_DATABASE: studyhub
          MYSQL_USER: studyhub
          MYSQL_PASSWORD: ci-app-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: server

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: studyhub
      MYSQL_USER: studyhub
      MYSQL_PASSWORD: ci-app-test-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Apply MySQL migrations
        run: python -m alembic upgrade head

      - name: Import academic data
        run: python -m app.import_data

      - name: Verify repeat import
        run: python -m app.import_data

      - name: Test REST API with MySQL
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.import_data import load_json, SLUG

          data = load_json("seed/data.json")
          content = load_json("seed/content.json")

          with TestClient(app) as client:
              health = client.get("/health")
              assert health.status_code == 200
              assert health.json()["status"] == "ok"

              base = f"/api/v1/groups/{SLUG}"

              response = client.get(base + "/bundle")
              assert response.status_code == 200
              bundle = response.json()

              assert bundle["tasks"] == content["tasks"]
              assert bundle["schedule"] == data["schedule"]
              assert bundle["announcements"] == content["announcements"]
              assert bundle["deadlines"] == content["deadlines"]
              assert bundle["variants"] == data["variants"]

              for digit in range(10):
                  r = client.get(base + f"/variants/{digit}")
                  assert r.status_code == 200
                  n = digit or 10
                  assert r.json()["variant"] == n
                  assert [t["topic"] for t in r.json()["tasks"]] == [
                      row[n-1] for row in data["variants"]
                  ]

              auth = client.post("/api/v1/auth/max")
              assert auth.status_code == 503

              print("MySQL integration tests: PASSED")
              print("Tasks:", len(bundle["tasks"]))
              print("Schedule:", len(bundle["schedule"]["entries"]))
              print("Variants: 40")
          PY
          
