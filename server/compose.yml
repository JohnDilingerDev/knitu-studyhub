services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique root password in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studyhub}
      MYSQL_USER: ${MYSQL_USER:-studyhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique app password in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build: .
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studyhub}
      MYSQL_USER: ${MYSQL_USER:-studyhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique app password in .env}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
volumes:
  mysql_data:
